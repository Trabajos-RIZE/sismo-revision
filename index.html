<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación Post-Sismo Cali v1.0</title>
    <!-- Vinculación del archivo de estilos CSS -->
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

<div class="container">
    <header>
        <h1>Evaluación de Edificaciones</h1>
        <p>Normativa Colombiana NSR-10 / Cali, Valle</p>
    </header>

    <div class="report-count" id="reportCount">Reportes guardados localmente: 0</div>

    <div class="card">
        <form id="sismoForm">
            <!-- 1. IDENTIFICACIÓN -->
            <div class="form-group">
                <label for="inspector">Nombre del Evaluador</label>
                <input type="text" id="inspector" placeholder="Ej. Ing. Juan Pérez" required>
            </div>

            <div class="form-group">
                <label for="direccion">Dirección o Referencia de la Estructura</label>
                <input type="text" id="direccion" placeholder="Ej. Calle 5 # 10-25, Barrio San Antonio" required>
            </div>

            <!-- 2. GEOLOCALIZACIÓN -->
            <div class="form-group">
                <label for="gps">Coordenadas GPS (Requerido para GIS)</label>
                <input type="text" id="gps" placeholder="Calculando coordenadas..." readonly required>
                <button type="button" class="btn-gps" id="btnGps">Obtener Ubicación Actual 📍</button>
            </div>

            <!-- 3. CARACTERIZACIÓN -->
            <div class="form-group">
                <label for="sistema">Sistema Estructural Predominante</label>
                <select id="sistema" required>
                    <option value="Porticos Concreto">Pórticos de Concreto Reforzado</option>
                    <option value="Mamposteria Confinada">Mampostería Confinada (Formal)</option>
                    <option value="Mamposteria Informal">Mampostería No Reforzada / Autoconstrucción (Ladera/Periferia)</option>
                    <option value="Muros Tunel">Muros de Ductilidad Limitada (Túnel)</option>
                </select>
            </div>

            <!-- 4. PATOLOGÍAS CRÍTICAS -->
            <div class="form-group">
                <label for="fallaCritica">Elementos Críticos (Columnas, Vigas, Nudos)</label>
                <select id="fallaCritica" required>
                    <option value="Ninguna">Ninguna / Fisuras estéticas menores</option>
                    <option value="Grietas diagonales">Grietas diagonales a 45° en vigas o columnas</option>
                    <option value="Concreto triturado">Concreto triturado en nudos / Acero expuesto</option>
                </select>
            </div>

            <div class="form-group">
                <label for="fallaMuros">Muros de Carga / Divisorios</label>
                <select id="fallaMuros" required>
                    <option value="Ninguna">Ninguna / Fisuras leves</option>
                    <option value="Grietas X Moderadas">Grietas en forma de "X" moderadas (1 a 3mm)</option>
                    <option value="Grietas X Severas">Grietas en "X" severas (Más de 3mm) o desprendimiento</option>
                </select>
            </div>

            <div class="form-group">
                <label for="fallaSuelo">Entorno y Geotecnia (Suelo/Talud)</label>
                <select id="fallaSuelo" required>
                    <option value="Estable">Suelo estable sin novedades</option>
                    <option value="Grietas Suelo">Grietas en el suelo o asentamientos menores</option>
                    <option value="Falla Talud">Deslizamiento de talud colindante / Inclinación del edificio</option>
                </select>
            </div>

            <div class="form-group">
                <label for="notas">Notas de Campo adicionales</label>
                <textarea id="notas" rows="2" placeholder="Detalles específicos del daño..."></textarea>
            </div>

            <!-- SEMÁFORO DE RESPUESTA AUTOMÁTICA -->
            <div class="form-group">
                <label>Dictamen de Habitabilidad Automático (NSR-10)</label>
                <div class="triage-box" id="triageDisplay">P1 - Habitable (Verde)</div>
            </div>

            <button type="submit" class="btn-submit">Guardar Reporte Localmente 💾</button>
        </form>
    </div>

    <!-- PANEL DE CONTROL PARA QGIS -->
    <div class="card panel-gis">
        <label>Panel de Exportación Institucional</label>
        <div class="actions-panel">
            <button class="btn-action btn-geojson" id="btnExportar">Descargar Capa QGIS (.geojson)</button>
            <button class="btn-action btn-clear" id="btnLimpiar">Borrar Datos Locales 🗑️</button>
        </div>
    </div>
</div>

<!-- Vinculación del archivo lógico JavaScript -->
<script src="app.js"></script>
</body>
</html>
